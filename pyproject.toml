[project]
name = "agente-inteligente-puc"
version = "0.0.1"
description = "Agente inteligente para automatizar el registro de ventas bajo el PUC en MiPymes colombianas"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # "lxml>=5.0",   # opcional; el parser actual usa xml.etree de la stdlib
    "groq>=1.7.0",
    "fastapi>=0.163.2",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.34",
    "pypdf>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agente"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
